name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: demo
        run: python -m sparefold demo
      - name: audit
        run: python -m sparefold swarm audit
      - name: audit against base
        if: github.event_name == 'pull_request'
        run: python -m sparefold swarm audit --base origin/${{ github.base_ref }}
